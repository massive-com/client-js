name: Install check

# Run `npm ci` on any PR that touches dependencies. Dependabot bumps (e.g. the
# release-it updates in #339 and #347) have twice merged a package-lock.json
# that `npm ci` rejects, which only surfaced the next morning when the
# Sync OpenAPI client workflow failed at "Install dependencies".

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/install-check.yml'

permissions:
  contents: read

jobs:
  npm-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same Node version as sync-openapi.yml, so a pass here means the sync's
      # install step will pass too.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
